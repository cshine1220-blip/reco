name: Update Recommendations

on:
  schedule:
    - cron: '0 6 * * *' # 每天 UTC 06:00 執行一次（可根據需要調整）
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: |
          cd outputs/cycu-general-education-planner
          npm install
      - name: Run updater
        run: |
          cd outputs/cycu-general-education-planner
          npm run update:recs
      - name: Commit changes
        run: |
          cd outputs/cycu-general-education-planner
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recommendations.json
          git commit -m "chore: auto-update recommendations.json"
          git push
