name: Update Recommendations

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci
        working-directory: cycu-general-education-planner

      - name: Run recommendations updater
        run: npm run update:recs
        working-directory: cycu-general-education-planner

      - name: Commit and push updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cycu-general-education-planner/recommendations.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update recommendations.json (from actions)"
            git push
          else
            echo "No changes to commit"
          fi
